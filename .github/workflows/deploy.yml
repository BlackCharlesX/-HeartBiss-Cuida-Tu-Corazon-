name: Despliegue CI/CD (Vercel + Google Cloud VM + Android APK)

on:
  # 1. Despliegue AUTOMÁTICO cada vez que se hace push a la rama main o master
  push:
    branches:
      - main
      - master
  # 2. Despliegue MANUAL desde GitHub -> pestaña "Actions" -> botón "Run workflow"
  workflow_dispatch:
    inputs:
      target:
        description: '¿Qué deseas actualizar o compilar?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend-vm
          - frontend-vercel
          - android-apk

jobs:
  # ==========================================================
  # Verificación de compilación del Frontend (Client)
  # ==========================================================
  build-frontend:
    name: Build & Verify Frontend (Vercel)
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend-vercel'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto Vite
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://35.202.222.119.nip.io/api' }}
        run: npm run build

  # ==========================================================
  # Actualización Automática/Manual del Backend en la VM de Google Cloud
  # ==========================================================
  deploy-backend-vm:
    name: Deploy Backend to Google Cloud VM (SSH)
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'backend-vm'
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
    steps:
      - name: Actualizar código y reiniciar servidor en VM de Google Cloud
        if: env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST || '35.202.222.119' }}
          username: ${{ secrets.GCP_VM_USER || 'carlosguadaluperamirezvallejo' }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ~/app
            git fetch origin main
            git reset --hard origin/main
            cd ~/app/server
            mkdir -p public/uploads/apk public/images/uploads
            npm install --omit=dev
            if [ -f public/uploads/apk/debug/app-debug.apk ]; then
              mv -f public/uploads/apk/debug/app-debug.apk public/uploads/apk/jovenes-con-salud-latest.apk
              node scripts/register-apk.js public/uploads/apk/jovenes-con-salud-latest.apk "2.0.${{ github.run_number }}" || true
            fi
            pm2 restart heartbiss-api
            echo "✅ Backend actualizado correctamente en la VM de Google Cloud"

  # ==========================================================
  # Compilación y Publicación Automática del APK de Android (Capacitor)
  # Compila el APK con Node 22 + Java 21, lo deja en Artifacts de GitHub
  # y además lo sube y activa automáticamente en tu servidor de Google Cloud.
  # ==========================================================
  build-android-apk:
    name: Build & Publish Android APK (Capacitor)
    needs: deploy-backend-vm
    if: always() && (github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android-apk')
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (requerido por @capacitor/cli 8.4)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Configurar Java 21 (requerido por Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias y sincronizar Capacitor Android
        working-directory: ./client
        env:
          VITE_API_URL: https://35.202.222.119.nip.io/api
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK con Gradle
        working-directory: ./client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK compilado como descargable en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Jovenes-con-Salud-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Enviar APK compilado al servidor de Google Cloud
        if: env.SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_HOST || '35.202.222.119' }}
          username: ${{ secrets.GCP_VM_USER || 'carlosguadaluperamirezvallejo' }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          source: "client/android/app/build/outputs/apk/debug/app-debug.apk"
          target: "/home/carlosguadaluperamirezvallejo/app/server/public/uploads/apk"
          strip_components: 7

      - name: Activar el nuevo APK automáticamente en la plataforma
        if: env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST || '35.202.222.119' }}
          username: ${{ secrets.GCP_VM_USER || 'carlosguadaluperamirezvallejo' }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ~/app/server
            if [ -f public/uploads/apk/debug/app-debug.apk ]; then
              mv -f public/uploads/apk/debug/app-debug.apk public/uploads/apk/jovenes-con-salud-latest.apk
            elif [ -f public/uploads/apk/app-debug.apk ]; then
              mv -f public/uploads/apk/app-debug.apk public/uploads/apk/jovenes-con-salud-latest.apk
            fi
            node scripts/register-apk.js public/uploads/apk/jovenes-con-salud-latest.apk "2.0.${{ github.run_number }}"
